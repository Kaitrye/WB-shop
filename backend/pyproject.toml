[project]
name = "wb"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Kaitrye",email = "bogdanova.tekna156@yandex.ru"},
]
dependencies = ["django>=6.1.3", "uvicorn>=0.54.0", "django-environ>=0.14.0", "djangorestframework>=3.18.3", "djangorestframework-simplejwt>=5.5.1", "drf-spectacular>=0.30.0", "psycopg[binary]>=3.3.8"]
requires-python = "==3.12.*"
readme = "README.md"
license = {text = "MIT"}


[project.optional-dependencies]
lint = [
    "ruff>=0.17.4",
]
[tool.pdm]
distribution = false

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
